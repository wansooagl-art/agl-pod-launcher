<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>AGL POD TEST</title>

  <link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/png"
      href="../AGL_POD_ICON_MEDIUM.png">

<link rel="apple-touch-icon"
      href="../AGL_POD_ICON_MEDIUM.png">

  <meta name="theme-color" content="#3f518e">

  <meta name="apple-mobile-web-app-capable"
        content="yes">

  <meta name="apple-mobile-web-app-status-bar-style"
        content="default">

  <meta name="apple-mobile-web-app-title"
        content="AGL POD TEST">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6fb;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 500px;
      padding: 35px 20px;
    }

    .logo {
      width: 180px;
      height: 180px;
      object-fit: contain;
      border-radius: 32px;
    }

    h1 {
      margin: 24px 0 15px;
      font-size: 38px;
    }

    p {
      font-size: 23px;
      line-height: 1.5;
      color: #555;
    }

    .installNotice {
      margin-top: 25px;
      padding: 25px;
      background: #fff;
      border-radius: 20px;
      font-size: 22px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 30px;
      padding: 22px;
      border: none;
      border-radius: 20px;
      background: #3f518e;
      color: white;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">

  <img
    class="logo"
    src="../AGL_POD_ICON.png"
    alt="AGL POD"
  >

  <h1>AGL POD TEST</h1>

  <div class="installNotice">
    <strong>Install First</strong><br><br>

    Chrome menu → Add to Home screen<br>
    홈 화면에 먼저 추가하세요.
  </div>

  <p>
    After installation, open AGL POD TEST
    from the icon on your Home Screen.
  </p>

  <button onclick="openTestApp()">
    Open TEST Web App
  </button>

</div>

<script>

const TEST_APP_URL =
  "https://script.google.com/macros/s/AKfycbwaa9HCXuYZ5FdZgticafZKUsGvgNrb_IDOg_p2HFu4Xy62hQX3t4KwG-pLGuKi2uo/exec";


/*
  IMPORTANT

  Normal browser:
  DO NOT automatically redirect.
  This gives Chrome time to read the
  manifest and AGL icon.

  Installed / standalone:
  Automatically open TEST Web App.
*/

window.addEventListener(
  'load',
  function() {

    const installed =
      window.matchMedia(
        '(display-mode: standalone)'
      ).matches ||
      window.navigator.standalone === true;

    if (installed) {

      setTimeout(
        function() {
          window.location.replace(
            TEST_APP_URL
          );
        },
        800
      );
    }
  }
);


function openTestApp() {

  window.location.href =
    TEST_APP_URL;
}

</script>

</body>
</html>
