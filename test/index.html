<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AGL POD TEST</title>

  <!-- TEST Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Same icon style as existing AGL POD -->
  <link
    rel="icon"
    type="image/png"
    href="../AGL_POD_ICON_MEDIUM.png"
  >

  <link
    rel="apple-touch-icon"
    href="../AGL_POD_ICON_MEDIUM.png"
  >

  <meta name="theme-color" content="#5268ad">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="AGL POD TEST"
  >

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6fb;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 520px;
      padding: 35px 20px;
    }

    .logo {
      width: 180px;
      height: 180px;
      object-fit: contain;
      border-radius: 32px;
    }

    h1 {
      margin: 24px 0 10px;
      font-size: 38px;
      color: #222;
    }

    .test-label {
      display: inline-block;
      margin-top: 5px;
      padding: 8px 18px;
      border-radius: 20px;
      background: #5268ad;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .install-box {
      margin-top: 28px;
      padding: 25px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .install-title {
      font-size: 25px;
      font-weight: bold;
      color: #222;
      margin-bottom: 15px;
    }

    .install-text {
      font-size: 21px;
      line-height: 1.6;
      color: #555;
    }

    .important {
      margin-top: 20px;
      font-size: 19px;
      line-height: 1.5;
      color: #777;
    }

    .open-button {
      width: 100%;
      margin-top: 30px;
      padding: 22px 20px;
      border: 0;
      border-radius: 18px;
      background: #5268ad;
      color: white;
      font-size: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    .open-button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="container">

    <img
      class="logo"
      src="../AGL_POD_ICON_MEDIUM.png"
      alt="AGL POD TEST"
    >

    <h1>AGL POD TEST</h1>

    <div class="test-label">
      TEST VERSION
    </div>

    <div class="install-box">

      <div class="install-title">
        Install AGL POD TEST
      </div>

      <div class="install-text">
        Chrome menu<br>
        ↓<br>
        <strong>Add to Home screen</strong>
        <br><br>
        먼저 홈 화면에 추가하세요.
      </div>

    </div>

    <div class="important">
      설치하기 전에는 아래 버튼을 누르지 마세요.<br>
      홈 화면에 추가한 후 AGL POD TEST 아이콘으로 실행하세요.
    </div>

    <button
      class="open-button"
      onclick="openTestApp()"
    >
      Open TEST Web App
    </button>

  </div>


  <script>

    const TEST_APP_URL =
      "https://script.google.com/macros/s/AKfycbwaa9HCXuYZ5FdZgticafZKUsGvgNrb_IDOg_p2HFu4Xy62hQX3t4KwG-pLGuKi2uo/exec";


    /*
      IMPORTANT:

      Normal URL:
      /test/

      -> Stay on installation page.
      -> DO NOT automatically open Apps Script.


      Installed Home Screen URL:
      /test/?launch=1

      -> Open AGL POD TEST automatically.
    */

    window.addEventListener(
      "load",
      function () {

        const params =
          new URLSearchParams(
            window.location.search
          );

        const launch =
          params.get("launch");

        if (launch === "1") {

          window.location.replace(
            TEST_APP_URL
          );

        }

      }
    );


    /*
      Manual open button
    */

    function openTestApp() {

      window.location.href =
        TEST_APP_URL;

    }

  </script>

</body>
</html>
