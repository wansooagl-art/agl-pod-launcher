<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AGL POD</title>
  
<link rel="manifest" href="manifest.json">
  
  <link
    rel="icon"
    type="image/png"
    href="AGL_POD_ICON.png"
  >

  <link
    rel="apple-touch-icon"
    href="AGL_POD_ICON.png"
  >

  <meta
    name="theme-color"
    content="#5268ad"
  >

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f6fb;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    body {
      min-height: 100vh;
    }

    .screen {
      min-height: 100vh;
      padding: 40px 24px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .logo {
      width: 180px;
      height: 180px;
      object-fit: contain;
    }

    .title {
      margin-top: 24px;
      font-size: 42px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 20px;
      color: #666;
    }

    .openButton {
      width: 100%;
      max-width: 520px;
      height: 96px;

      margin-top: 42px;

      border: none;
      border-radius: 48px;

      background: #5268ad;
      color: white;

      font-size: 30px;
      font-weight: 800;

      cursor: pointer;
    }

    .hint {
      margin-top: 28px;
      max-width: 520px;

      font-size: 17px;
      line-height: 1.5;
      color: #777;
    }
  </style>
</head>


<body>

<div class="screen">

  <img
    class="logo"
    src="AGL_POD_ICON.png"
    alt="AGL POD"
  >

  <div class="title">
    AGL POD
  </div>

  <div class="subtitle">
    Photo Upload
  </div>

  <button
    class="openButton"
    onclick="openApp()"
  >
    OPEN AGL POD
  </button>

  <div class="hint">
    Add this page to your Home screen first.<br>
    홈 화면에 이 페이지를 추가한 뒤 사용하세요.
  </div>

</div>


<script>

function openApp() {

  window.location.href =
    'https://script.google.com/macros/s/AKfycbxsOGVE7UlO8yuE-CR9yyYPWr3Yp7TH4wI6vaKsnCcvr00eZTuXHuadt_MLgz2-culQ/exec';
}

</script>

</body>
</html>
